# Sonde provisoire (0.5) : la machine Windows de GitHub sait-elle lire du texte
# (Windows.Media.Ocr) ? À retirer avant la demande d'intégration.
name: Sonde texte

on:
  push:
    branches:
      - 'claude/project-thread-tkz3qd'
    paths:
      - '.github/workflows/sonde-texte.yml'

permissions:
  contents: read

jobs:
  sonde:
    name: Lecture du texte sur windows-latest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Système
        shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber
          Get-WinUserLanguageList | Format-Table LanguageTag, Autonym
      - name: Langues de lecture avant
        shell: powershell
        run: |
          $null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType = WindowsRuntime]
          $l = [Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages
          "langues : $($l.Count) : $(($l | ForEach-Object LanguageTag) -join ', ')"
          "max : $([Windows.Media.Ocr.OcrEngine]::MaxImageDimension)"
          $m = [Windows.Media.Ocr.OcrEngine]::TryCreateFromUserProfileLanguages()
          "moteur du profil : $(if ($m) { $m.RecognizerLanguage.LanguageTag } else { 'null' })"
          Get-WindowsCapability -Online | Where-Object Name -like 'Language.OCR*' |
            Format-Table Name, State
      - name: Lecture d'un texte
        shell: powershell
        run: |
          $null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType = WindowsRuntime]
          $null = [Windows.Graphics.Imaging.BitmapDecoder, Windows.Foundation, ContentType = WindowsRuntime]
          $null = [Windows.Storage.StorageFile, Windows.Storage, ContentType = WindowsRuntime]
          $null = [Windows.Globalization.Language, Windows.Foundation, ContentType = WindowsRuntime]
          Add-Type -AssemblyName System.Runtime.WindowsRuntime
          Add-Type -AssemblyName System.Drawing
          $l = [Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages
          "langues : $($l.Count) : $(($l | ForEach-Object LanguageTag) -join ', ')"
          if ($l.Count -eq 0) { "AUCUNE LANGUE"; exit 0 }
          $asTask = ([System.WindowsRuntimeSystemExtensions].GetMethods() | Where-Object {
              $_.Name -eq 'AsTask' -and $_.GetParameters().Count -eq 1 -and
              $_.GetParameters()[0].ParameterType.Name -eq 'IAsyncOperation`1' })[0]
          function Attendre($op, $type) {
            $t = $asTask.MakeGenericMethod($type).Invoke($null, @($op))
            $null = $t.Wait(30000)
            $t.Result
          }
          function Lire($texte, $taille, $moteur) {
            $bmp = New-Object Drawing.Bitmap 900, 200
            $g = [Drawing.Graphics]::FromImage($bmp)
            $g.Clear([Drawing.Color]::White)
            $g.TextRenderingHint = 'ClearTypeGridFit'
            $p = New-Object Drawing.Font 'Segoe UI', $taille, ([Drawing.GraphicsUnit]::Pixel)
            $g.DrawString($texte, $p, [Drawing.Brushes]::Black, 20, 40)
            $g.Dispose()
            $f = Join-Path $env:RUNNER_TEMP "sonde-$taille.png"
            $bmp.Save($f, [Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
            $sf = Attendre ([Windows.Storage.StorageFile]::GetFileFromPathAsync($f)) `
              ([Windows.Storage.StorageFile])
            $flux = Attendre ($sf.OpenAsync([Windows.Storage.FileAccessMode]::Read)) `
              ([Windows.Storage.Streams.IRandomAccessStream])
            $dec = Attendre ([Windows.Graphics.Imaging.BitmapDecoder]::CreateAsync($flux)) `
              ([Windows.Graphics.Imaging.BitmapDecoder])
            $sb = Attendre ($dec.GetSoftwareBitmapAsync()) `
              ([Windows.Graphics.Imaging.SoftwareBitmap])
            $t = [Diagnostics.Stopwatch]::StartNew()
            $r = Attendre ($moteur.RecognizeAsync($sb)) ([Windows.Media.Ocr.OcrResult])
            "taille $taille px, $([int]$t.Elapsed.TotalMilliseconds) ms : [$($r.Text)]"
          }
          foreach ($lang in $l) {
            $t = [Diagnostics.Stopwatch]::StartNew()
            $m = [Windows.Media.Ocr.OcrEngine]::TryCreateFromLanguage($lang)
            "moteur $($lang.LanguageTag) pret en $([int]$t.Elapsed.TotalMilliseconds) ms"
            foreach ($taille in 9, 11, 12, 14, 16, 24) {
              Lire 'Hello BreezyShot 2026, the quick brown fox: 42' $taille $m
            }
          }
          $m = [Windows.Media.Ocr.OcrEngine]::TryCreateFromUserProfileLanguages()
          "moteur du profil : $(if ($m) { $m.RecognizerLanguage.LanguageTag } else { 'null' })"
