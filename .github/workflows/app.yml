name: App

on:
  push:
    branches-ignore:
      - 'prototypes/**'
      - 'resultats-**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (tests, .exe, essais)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/coeur

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Outil Tauri (version figée)
        working-directory: app
        run: npm ci

      - name: Jetons à jour (jetons.css généré)
        run: node outils/generer-jetons.mjs --verifier

      - name: Format
        working-directory: app/coeur
        run: cargo fmt --check

      - name: Clippy
        working-directory: app/coeur
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        working-directory: app/coeur
        env:
          # Sur cette machine le presse-papiers existe : son test ne doit pas pouvoir sauter.
          BREEZYSHOT_PRESSE_PAPIERS_OBLIGATOIRE: "1"
        run: cargo test --locked -- --show-output

      - name: Construire breezyshot.exe (release)
        working-directory: app
        run: npx tauri build --no-bundle -- --locked

      - name: Essais
        # 01 à 09 ; une étape bloquée ne doit pas manger tout le job.
        timeout-minutes: 30
        run: ./essais/lancer.ps1 -Exe app/coeur/target/release/breezyshot.exe -Sortie essais-resultats

      - name: Envoyer le .exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breezyshot-exe
          path: app/coeur/target/release/breezyshot.exe
          if-no-files-found: warn

      - name: Envoyer les journaux d'essai
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essais-resultats
          path: essais-resultats/
          if-no-files-found: warn

  pages:
    name: Pages (bandeau, sélection, vignette dans Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Playwright (version figée)
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Jetons à jour
        run: node outils/generer-jetons.mjs --verifier

      - name: Essai de la page du bandeau
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules
          SORTIE: ${{ github.workspace }}/essais-resultats/pages
        run: node essais/pages/bandeau.cjs

      - name: Essai de la page de sélection
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules
          SORTIE: ${{ github.workspace }}/essais-resultats/pages
        run: node essais/pages/selection.cjs

      - name: Essai de la page des réglages
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules
          SORTIE: ${{ github.workspace }}/essais-resultats/pages
        run: node essais/pages/reglages.cjs

      - name: Essai des pages de la vignette et du souffle
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules
          SORTIE: ${{ github.workspace }}/essais-resultats/pages
        run: |
          node essais/pages/vignette.cjs
          node essais/pages/souffle.cjs

      - name: Essai de la page de l'installateur
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules
          SORTIE: ${{ github.workspace }}/essais-resultats/pages
        run: node essais/pages/installateur.cjs

      - name: Envoyer les captures de la page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-resultats
          path: essais-resultats/pages/
          if-no-files-found: warn

  macos:
    name: macOS (check, tests)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/coeur

      - name: Check
        working-directory: app/coeur
        run: cargo check --locked --all-targets

      - name: Tests
        working-directory: app/coeur
        run: cargo test --locked

  publier:
    name: Version d'essai (pré-version GitHub)
    # Seulement quand main avance et que tout le reste est vert : le .exe qui vient de
    # passer les essais devient la pré-version « v<version>-essai », remplacée à chaque fois.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [windows, pages, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Reprendre le .exe essayé
        uses: actions/download-artifact@v4
        with:
          name: breezyshot-exe
          path: exe

      - name: Publier la pré-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/coeur/Cargo.toml | head -1)
          test -n "$version"
          etiquette="v${version}-essai"
          fichier="exe/BreezyShot-${version}-essai.exe"
          mv exe/breezyshot.exe "$fichier"
          # Le fichier réellement envoyé : exactement un .exe, et il ne s'appelle pas
          # breezyshot.exe (casse ignorée) : ce nom ferait de l'exe l'app, pas
          # l'installateur (arguments::lancement).
          envoyes=$(find exe -maxdepth 1 -type f -iname '*.exe')
          test "$(printf '%s\n' "$envoyes" | grep -c .)" -eq 1
          test "$envoyes" = "$fichier"
          test "$(basename "$envoyes" | tr '[:upper:]' '[:lower:]')" != "breezyshot.exe"
          gh release delete "$etiquette" --yes --cleanup-tag || true
          # Tant que l'ancienne étiquette existe, gh ignore --target et la pré-version
          # pointerait l'ancien commit : on attend sa disparition (30 s au plus).
          for i in $(seq 1 15); do
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$etiquette" >/dev/null 2>&1 || break
            sleep 2
          done
          gh release create "$etiquette" "$fichier" --prerelease \
            --title "BreezyShot ${version} (essai)" --notes-file docs/ESSAI.md --target "$GITHUB_SHA"
          # Et on le prouve : l'étiquette doit pointer le commit qui vient d'être essayé.
          pointe=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$etiquette" --jq .object.sha)
          test "$pointe" = "$GITHUB_SHA"
          # Une seule pré-version d'essai : les autres « v*-essai » (d'anciennes versions)
          # sont supprimées avec leur étiquette. Seules les pré-versions dont l'étiquette
          # finit par -essai sont touchées, jamais une vraie version.
          # La publication est faite : un ménage raté s'annonce sans faire échouer la tâche.
          anciennes=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.prerelease and (.tag_name | test("^v.+-essai$"))) | .tag_name') ||
            { echo "::warning::liste des pré-versions illisible, aucune suppression"; anciennes=""; }
          for autre in $anciennes; do
            if [ "$autre" != "$etiquette" ]; then
              if gh release delete "$autre" --yes --cleanup-tag; then
                echo "ancienne pré-version d'essai supprimée : $autre"
              else
                echo "::warning::pré-version $autre non supprimée"
              fi
            fi
          done
