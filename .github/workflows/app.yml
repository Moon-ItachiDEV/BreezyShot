name: App

on:
  push:
    branches-ignore:
      - 'prototypes/**'
      - 'resultats-**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (tests, .exe, essais)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/coeur

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Outil Tauri (version figée)
        working-directory: app
        run: npm ci

      - name: Jetons à jour (jetons.css généré)
        run: node outils/generer-jetons.mjs --verifier

      - name: Format
        working-directory: app/coeur
        run: cargo fmt --check

      - name: Clippy
        working-directory: app/coeur
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        working-directory: app/coeur
        env:
          # Sur cette machine le presse-papiers existe : son test ne doit pas pouvoir sauter.
          BREEZYSHOT_PRESSE_PAPIERS_OBLIGATOIRE: "1"
        run: cargo test --locked -- --show-output

      - name: Construire breezyshot.exe (release)
        working-directory: app
        run: npx tauri build --no-bundle -- --locked

      - name: Essais
        # 01 à 04 ; une capture bloquée ne doit pas manger tout le temps du job.
        timeout-minutes: 20
        run: ./essais/lancer.ps1 -Exe app/coeur/target/release/breezyshot.exe -Sortie essais-resultats

      - name: Envoyer le .exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breezyshot-exe
          path: app/coeur/target/release/breezyshot.exe
          if-no-files-found: warn

      - name: Envoyer les journaux d'essai
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essais-resultats
          path: essais-resultats/
          if-no-files-found: warn

  pages:
    name: Pages (bandeau et sélection dans Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Playwright (version figée)
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Jetons à jour
        run: node outils/generer-jetons.mjs --verifier

      - name: Essai de la page du bandeau
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules
          SORTIE: ${{ github.workspace }}/essais-resultats/pages
        run: node essais/pages/bandeau.cjs

      - name: Essai de la page de sélection
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules
          SORTIE: ${{ github.workspace }}/essais-resultats/pages
        run: node essais/pages/selection.cjs

      - name: Envoyer les captures de la page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-resultats
          path: essais-resultats/pages/
          if-no-files-found: warn

  macos:
    name: macOS (check, tests)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/coeur

      - name: Check
        working-directory: app/coeur
        run: cargo check --locked --all-targets

      - name: Tests
        working-directory: app/coeur
        run: cargo test --locked
