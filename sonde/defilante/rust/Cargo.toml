# Exemples Rust de la sonde de la capture défilante (Windows seulement). Hors de l'app :
# rien ici n'entre dans app/. Versions figées sur celles de app/coeur/Cargo.lock (Cargo.lock
# de ce dossier, à jouer avec --locked).
#   cargo build --release --locked --examples
[package]
name = "sonde-defilante"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
tao = "=0.37.2"
wry = "=0.57.2"
png = { version = "=0.18.1", default-features = false }
arboard = { version = "=3.7.0", default-features = false, features = ["image-data"] }
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
