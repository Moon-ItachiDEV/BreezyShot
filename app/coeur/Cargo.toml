[package]
name = "breezyshot"
version = "0.6.2"
description = "Outil de capture d'écran pour Windows 11, puis macOS"
edition = "2021"
license = "FSL-1.1-MIT"
publish = false

[lib]
name = "breezyshot"
path = "src/lib.rs"

[[bin]]
name = "breezyshot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.5"
log = { version = "0.4", features = ["std"] }
tracing = { version = "0.1", features = ["log"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
tauri-plugin-global-shortcut = "2.4"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
png = { version = "0.18", default-features = false }
# Licence Pro (0.5) : signature Ed25519 vérifiée hors ligne, sans source de hasard ; base64
# déjà tirée par les dépendances de Tauri.
ed25519-compact = { version = "2", default-features = false, features = ["std"] }
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
# Copier le texte (0.5) : la lecture de Windows (Media.Ocr) et ce qu'elle demande pour
# passer une image (Graphics.Imaging, Storage.Streams, Security.Cryptography) et ses langues
# (Globalization), WinRT initialisé dans un fil (Win32_System_WinRT).
# Capture défilante (0.6) : UI Automation pour faire défiler une page et lire sa position
# (Win32_UI_Accessibility ; ses conditions prennent un VARIANT, Win32_System_Variant) ; le
# reste (BitBlt, WM_MOUSEWHEEL posté, fenêtres filles, SendInput, crochet WH_MOUSE_LL) est
# dans les fonctionnalités déjà là (Graphics_Gdi, UI_WindowsAndMessaging,
# UI_Input_KeyboardAndMouse).
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
# Savoir si WebView2 est là avant de montrer l'installateur (déjà tiré par wry).
webview2-com = "0.39"

[profile.release]
opt-level = 3

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
tempfile = "3"
