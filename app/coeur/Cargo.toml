[package]
name = "breezyshot"
version = "0.2.0"
description = "Outil de capture d'écran pour Windows 11, puis macOS"
edition = "2021"
license = "FSL-1.1-MIT"
publish = false

[lib]
name = "breezyshot"
path = "src/lib.rs"

[[bin]]
name = "breezyshot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.5"
log = { version = "0.4", features = ["std"] }
tracing = { version = "0.1", features = ["log"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
tauri-plugin-global-shortcut = "2.4"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
png = { version = "0.18", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
tempfile = "3"
