[package]
name = "breezyshot"
version = "0.1.0"
description = "Outil de capture d'écran pour Windows 11, puis macOS"
edition = "2021"
license = "FSL-1.1-MIT"
publish = false

[lib]
name = "breezyshot"
path = "src/lib.rs"

[[bin]]
name = "breezyshot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.5"
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
