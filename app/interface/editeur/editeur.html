<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annoter la capture</title>
<link rel="stylesheet" href="../commun/jetons.css">
<link rel="stylesheet" href="editeur.css">
<script type="module" src="editeur.js"></script>
</head>
<body>
<!--
  Structure seulement (contrat 0.4 « Éditeur », §10) : la scène, la barre, les menus, le
  dialogue. Le comportement (editeur.js, barre.js, outils.js) ne vise que les identifiants,
  les data-*, les rôles et les noms ; l'habillage est dans editeur.css (jetons seulement).
  Pictogrammes : ceux du design (piste A v2), sans ceux des outils reportés.
-->
<svg width="0" height="0" class="defs" aria-hidden="true">
  <defs>
    <symbol id="i-sel" viewBox="0 0 20 20"><path d="M5 3.5 15 9.2l-4.4 1.2-2.2 4.1z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 20 20"><path d="M4.5 15.5 15 5M8.5 5H15v6.5"/></symbol>
    <symbol id="i-arrowc" viewBox="0 0 20 20"><path d="M4 15.5C5 9 9 5.5 15 5"/>
      <path d="M10.5 3.2 15 5l-2.6 4"/></symbol>
    <symbol id="i-arrowd" viewBox="0 0 20 20">
      <path d="M5 15 15 5M9.5 5H15v5.5M10.5 15H5V9.5"/></symbol>
    <symbol id="i-rect" viewBox="0 0 20 20">
      <rect x="3.5" y="5" width="13" height="10" rx="2.5"/></symbol>
    <symbol id="i-ell" viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="6.8" ry="5.3"/></symbol>
    <symbol id="i-line" viewBox="0 0 20 20"><path d="M4.5 15.5 15.5 4.5"/></symbol>
    <symbol id="i-pen" viewBox="0 0 20 20">
      <path d="M4 16l1-3.5 8.5-8.5a1.8 1.8 0 0 1 2.5 2.5L7.5 15z"/><path d="M12 5.5l2.5 2.5"/>
    </symbol>
    <symbol id="i-hl" viewBox="0 0 20 20"><path d="M5 13.5 11.5 7l2.5 2.5L7.5 16H5z"/>
      <path d="M3 18h14" stroke-width="2.4" opacity=".45"/></symbol>
    <symbol id="i-text" viewBox="0 0 20 20"><path d="M5 5.5V4h10v1.5M10 4v12M7.5 16h5"/></symbol>
    <symbol id="i-num" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/>
      <path d="M8.6 7.6 10.4 6.5v7M8.6 13.5h3.6"/></symbol>
    <symbol id="i-pixel" viewBox="0 0 20 20">
      <rect x="3.5" y="3.5" width="13" height="13" rx="1.5"/>
      <path d="M3.5 8h13M3.5 12h13M8 3.5v13M12 3.5v13"/></symbol>
    <symbol id="i-smooth" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="6.5" stroke-dasharray="1.5 2.2"/>
      <circle cx="10" cy="10" r="3" opacity=".6"/></symbol>
    <symbol id="i-box" viewBox="0 0 20 20">
      <rect x="3.5" y="6" width="13" height="8" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-crop" viewBox="0 0 20 20"><path d="M6 2.5V14h11.5M2.5 6H14v11.5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 20 20"><path d="M7.5 5 4 8.5 7.5 12"/>
      <path d="M4 8.5h8a4 4 0 0 1 0 8H9"/></symbol>
    <symbol id="i-redo" viewBox="0 0 20 20"><path d="M12.5 5 16 8.5 12.5 12"/>
      <path d="M16 8.5H8a4 4 0 0 0 0 8h3"/></symbol>
    <symbol id="i-more" viewBox="0 0 20 20"><circle cx="5" cy="10" r=".6" fill="currentColor"/>
      <circle cx="10" cy="10" r=".6" fill="currentColor"/>
      <circle cx="15" cy="10" r=".6" fill="currentColor"/></symbol>
    <symbol id="i-pick" viewBox="0 0 20 20">
      <path d="M12.5 4.2a1.9 1.9 0 0 1 2.7 0l.6.6a1.9 1.9 0 0 1 0 2.7l-1.6 1.6-3.3-3.3z"/>
      <path d="m11.6 6.1-6.8 6.8-.8 3.1 3.1-.8 6.8-6.8"/></symbol>
    <symbol id="i-full" viewBox="0 0 20 20">
      <rect x="3.5" y="3.5" width="13" height="13" rx="1.5" stroke-dasharray="2.5 2.2"/></symbol>
    <symbol id="i-saveas" viewBox="0 0 20 20">
      <path d="M4 4.5h9l3 3V15a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 4 15z"/>
      <path d="M7 4.5v3.5h5V4.5M7 16.5v-4h6v4"/></symbol>
    <symbol id="i-dup" viewBox="0 0 20 20"><rect x="6.5" y="6.5" width="10" height="10" rx="1.5"/>
      <path d="M13.5 6.5V4.5A1.5 1.5 0 0 0 12 3H4.5A1.5 1.5 0 0 0 3 4.5V12a1.5 1.5 0 0 0
        1.5 1.5h2"/>
    </symbol>
    <symbol id="i-front" viewBox="0 0 20 20">
      <rect x="3" y="3" width="9" height="9" rx="1.5" opacity=".5"/>
      <rect x="8" y="8" width="9" height="9" rx="1.5" fill="currentColor" fill-opacity=".25"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 20 20">
      <rect x="3" y="3" width="9" height="9" rx="1.5" fill="currentColor" fill-opacity=".25"/>
      <rect x="8" y="8" width="9" height="9" rx="1.5" opacity=".5"/></symbol>
    <symbol id="i-del" viewBox="0 0 20 20">
      <path d="M4 6h12M8 6V4.5h4V6M6 6l.7 9.5a1.5 1.5 0 0 0 1.5 1.5h3.6a1.5 1.5 0 0 0
        1.5-1.5L14 6"/>
    </symbol>
    <symbol id="i-grip" viewBox="0 0 20 20"><circle cx="8" cy="6" r=".5"/>
      <circle cx="12" cy="6" r=".5"/><circle cx="8" cy="10" r=".5"/>
      <circle cx="12" cy="10" r=".5"/><circle cx="8" cy="14" r=".5"/>
      <circle cx="12" cy="14" r=".5"/></symbol>
    <symbol id="i-tune" viewBox="0 0 20 20"><path d="M4 6.5h12M4 13.5h12"/>
      <circle class="tune-rond" cx="7.5" cy="6.5" r="1.8"/>
      <circle class="tune-rond" cx="12.5" cy="13.5" r="1.8"/></symbol>
    <symbol id="i-fit" viewBox="0 0 20 20">
      <path d="M3.5 7.5v-4h4M12.5 3.5h4v4M16.5 12.5v4h-4M7.5 16.5h-4v-4"/></symbol>
    <symbol id="i-z100" viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="2"/>
      <path d="M6.5 8v4.5M13.5 8v4.5"/><circle cx="10" cy="9" r=".4" fill="currentColor"/>
      <circle cx="10" cy="11.8" r=".4" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="fenetre" id="fenetre">
  <main class="scene" id="scene" tabindex="-1" aria-label="Annoter la capture">
    <div class="ombre-image" id="ombre-image" hidden></div>
    <canvas class="vue" id="vue"></canvas>
    <textarea class="saisie" id="saisie" rows="1" hidden aria-label="Texte de l'annotation"
      spellcheck="false"></textarea>
    <div class="etiquette-zoom" id="etiquette-zoom" aria-live="polite"></div>
    <div class="message" id="message" role="status"></div>

    <div class="pop menu ctx" id="menu-objet" role="menu" aria-label="Forme">
      <button class="mi" type="button" role="menuitem" data-act="dupliquer"><svg class="ico">
        <use href="#i-dup"/></svg>Dupliquer</button>
      <button class="mi" type="button" role="menuitem" data-act="devant"><svg class="ico">
        <use href="#i-front"/></svg>Premier plan</button>
      <button class="mi" type="button" role="menuitem" data-act="derriere"><svg class="ico">
        <use href="#i-back"/></svg>Arrière-plan</button>
      <div class="msep"></div>
      <button class="mi danger" type="button" role="menuitem" data-act="supprimer"><svg
        class="ico"><use href="#i-del"/></svg>Supprimer</button>
    </div>

    <div class="barre" id="barre">
      <div class="pill" id="pastille-outils" role="toolbar" aria-label="Outils">
        <div class="outils" id="outils"><span class="ind" id="indicateur" aria-hidden="true"></span>
        </div>
        <span class="sep"></span>
        <button class="swb" id="bouton-reglages" type="button" aria-haspopup="dialog"
          aria-expanded="false" aria-label="Réglages de l'outil" data-tip="Réglages"><i></i><svg
          class="ico gl" aria-hidden="true"><use href="#i-tune"/></svg></button>
        <div class="pop menu" id="menu-variantes" role="menu"></div>
        <div class="pop" id="reglages-outil" role="dialog" aria-label="Réglages de l'outil"></div>
      </div>
      <div class="pill zpill" id="pastille-zoom" role="toolbar" aria-label="Zoom">
        <button class="tl" id="zoom-ajuster" type="button" aria-label="Ajuster" data-tip="Ajuster"
          data-key="Ctrl 0" aria-pressed="true"><svg class="ico"><use href="#i-fit"/></svg></button>
        <button class="tl" id="zoom-reel" type="button" aria-label="Taille réelle"
          data-tip="Taille réelle" data-key="Ctrl 1" aria-pressed="false"><svg class="ico">
          <use href="#i-z100"/></svg></button>
      </div>
      <div class="pill" id="pastille-actions" role="toolbar" aria-label="Actions">
        <button class="tl" type="button" data-act="annuler" aria-label="Annuler" data-tip="Annuler"
          data-key="Ctrl Z" disabled><svg class="ico"><use href="#i-undo"/></svg></button>
        <button class="tl" type="button" data-act="retablir" aria-label="Rétablir"
          data-tip="Rétablir" data-key="Ctrl Y" disabled><svg class="ico"><use href="#i-redo"/>
          </svg>
        </button>
        <span class="sep"></span>
        <button class="btn ghost vb" type="button" data-act="enregistrer" data-tip="Enregistrer"
          data-key="Ctrl S"><svg class="vi" viewBox="0 0 16 16" aria-hidden="true"><path
          class="tray" d="M2.5 10.5v1.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5v-1.5"/><g
          class="arw"><path d="M8 2.5v7M5.2 6.8 8 9.6l2.8-2.8"/></g><path class="ok"
          d="M3.5 7.4 6.6 10.4 12.5 3.8"/></svg><span class="lbs"><span
          class="l1">Enregistrer</span><span class="l2" aria-hidden="true">Enregistré</span></span>
        </button>
        <button class="btn accent vb" type="button" data-act="copier" data-tip="Copier"
          data-key="Ctrl C"><svg class="vi" viewBox="0 0 16 16" aria-hidden="true"><rect
          class="sh-b" x="5" y="5" width="8" height="8" rx="1.5"/><rect class="sh-f" x="3" y="3"
          width="8" height="8" rx="1.5"/><path class="ok"
          d="M3.5 8.4 6.6 11.4 12.5 4.8"/></svg><span
          class="lbs"><span class="l1">Copier</span><span class="l2"
          aria-hidden="true">Copié</span></span></button>
        <button class="tl" id="bouton-plus" type="button" aria-haspopup="menu" aria-expanded="false"
          aria-label="Plus" data-tip="Plus"><svg class="ico"><use href="#i-more"/></svg></button>
        <div class="pop menu" id="menu-plus" role="menu" aria-label="Plus d'actions">
          <button class="mi" type="button" role="menuitem" data-act="enregistrer_sous"><svg
            class="ico"><use href="#i-saveas"/></svg>Enregistrer sous…</button>
          <div class="mi drag" id="glisser" role="menuitem" tabindex="-1" aria-disabled="false"><img
            alt="" id="glisser-image"><span>Glisser</span><svg class="ico grip"><use
            href="#i-grip"/></svg></div>
        </div>
      </div>
    </div>
  </main>

  <div class="scrim" id="voile">
    <div class="dlg" id="dialogue" role="alertdialog" aria-modal="true"
      aria-labelledby="dialogue-titre">
      <div class="bd"><h2 id="dialogue-titre">Fermer sans garder ?</h2></div>
      <div class="ft">
        <button class="btn accent" type="button" data-act="copier_fermer">Copier et fermer</button>
        <button class="btn" type="button" data-act="ne_pas_garder">Ne pas garder</button>
        <button class="btn" type="button" data-act="continuer">Continuer</button>
      </div>
    </div>
  </div>
</div>
<div class="tip" id="infobulle" role="tooltip"></div>
</body>
</html>
