<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sélection BreezyShot</title>
<link rel="stylesheet" href="../commun/jetons.css">
<link rel="stylesheet" href="selection.css">
<script type="module" src="selection.js"></script>
</head>
<body>
  <!-- Au repos : le voile plein. Pendant un glisser : quatre panneaux autour de la zone,
       et le trait de la zone. En mode fenêtre : la fenêtre sous la souris, entourée, et le
       voile autour d'elle. Rien d'autre (ARCHITECTURE.md §9). La scène est en pixels
       réels, réduite par une transformation : tous les bords tombent juste. -->
  <div id="scene">
    <div class="voile" id="plein"></div>
    <div class="voile panneau" id="haut"></div>
    <div class="voile panneau" id="bas"></div>
    <div class="voile panneau" id="gauche"></div>
    <div class="voile panneau" id="droite"></div>
    <div id="zone"></div>
    <div id="fenetre"></div>
  </div>
</body>
</html>
