<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandeau BreezyShot</title>
<link rel="stylesheet" href="../commun/jetons.css">
<link rel="stylesheet" href="bandeau.css">
<link rel="stylesheet" href="decompte.css">
<script type="module" src="bandeau.js"></script>
</head>
<body>
  <!-- La fenêtre est transparente et laisse passer les clics : seule la pilule se voit. -->
  <div class="scene">
    <div class="bandeau" id="bandeau" role="status" aria-live="polite" hidden>
      <span class="pastille" aria-hidden="true"></span>
      <span class="texte"><b class="titre"></b><span class="detail"></span></span>
      <span class="boutons"></span>
    </div>
  </div>
  <!-- Décompte du retardateur (decompte.js) : disque, anneau, chiffre, croix « Annuler ». -->
  <div class="decompte" id="decompte" role="timer" aria-live="off" hidden>
    <div class="disque">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="piste" cx="50" cy="50" r="48"/>
        <circle class="progression" cx="50" cy="50" r="48"/>
      </svg>
      <span class="chiffre"></span>
    </div>
    <button class="annuler" type="button" tabindex="-1" aria-label="Annuler">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
    </button>
  </div>
</body>
</html>
