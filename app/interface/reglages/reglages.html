<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réglages de BreezyShot</title>
<link rel="stylesheet" href="../commun/jetons.css">
<link rel="stylesheet" href="reglages.css">
<script type="module" src="reglages.js"></script>
<script type="module" src="habillage.js"></script>
</head>
<body>
  <!--
    Structure seulement : les rubriques, les lignes et leurs contrôles. Le comportement
    (reglages.js) et les essais ne s'appuient que sur les attributs data-*, les rôles et les
    noms accessibles ; l'habillage est dans reglages.css (direction B « Épuré »), et
    habillage.js ne fait que poser les mesures des pastilles qui glissent et replier ce qui
    dépend d'un interrupteur éteint.
    Une ligne n'est montrée que si le cœur la nomme dans `vue.lignes`.
  -->
  <div class="cadre">
    <nav class="rubriques" role="tablist" aria-orientation="horizontal" aria-label="Rubriques">
      <span class="trait" aria-hidden="true"></span>
      <button role="tab" id="onglet-capture" data-rubrique="capture"
        aria-controls="rubrique-capture" aria-selected="true"><svg class="onglet-picto" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V4.5A1.5 1.5 0 0 1 4.5 3H7M13 3h2.5A1.5 1.5 0 0 1 17 4.5V7M17 13v2.5a1.5 1.5 0 0 1-1.5 1.5H13M7 17H4.5A1.5 1.5 0 0 1 3 15.5V13"/><path d="M10 7.5v5M7.5 10h5"/></svg><span>Capture</span></button>
      <button role="tab" id="onglet-apres" data-rubrique="apres" aria-controls="rubrique-apres"
        aria-selected="false" tabindex="-1"><svg class="onglet-picto" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="11" rx="1.5"/><rect x="4.5" y="9" width="6" height="4" rx="1"/></svg><span>Après la capture</span></button>
      <button role="tab" id="onglet-raccourcis" data-rubrique="raccourcis"
        aria-controls="rubrique-raccourcis" aria-selected="false" tabindex="-1"><svg class="onglet-picto" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="5.5" width="15" height="9" rx="1.5"/><path d="M5.5 8.5h1M9.5 8.5h1M13.5 8.5h1M6.5 11.5h7"/></svg><span>Raccourcis</span></button>
      <button role="tab" id="onglet-general" data-rubrique="general" aria-controls="rubrique-general"
        aria-selected="false" tabindex="-1"><svg class="onglet-picto" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 9 10 3.5 16.5 9v7a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/><path d="M8 17v-4.5h4V17"/></svg><span>Général</span></button>
    </nav>

    <main class="contenu">
      <p class="alerte" data-alerte role="status" hidden></p>

      <section id="rubrique-capture" role="tabpanel" data-rubrique="capture"
        aria-labelledby="onglet-capture">
        <div class="groupe">
          <div class="ligne" data-reglage="retardateur" hidden>
            <div class="lb"><span class="libelle" id="l-retardateur">Retardateur</span><p class="refus" data-refus role="status" hidden></p></div>
            <div class="choix" role="radiogroup" data-controle="retardateur" aria-labelledby="l-retardateur"></div>
          </div>
          <div class="ligne" data-reglage="pointeur" hidden>
            <div class="lb"><span class="libelle" id="l-pointeur">Inclure le pointeur</span><p class="refus" data-refus role="status" hidden></p></div>
            <button role="switch" data-controle="pointeur" aria-labelledby="l-pointeur"
              aria-checked="false"><svg class="sw-picto sw-non" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg><svg class="sw-picto sw-oui" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.5 10.5 11.5 3.5"/></svg><span class="sw-bouton" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.2 6.4 4.8 9 9.8 3.2"/></svg></span></button>
          </div>
        </div>
      </section>

      <section id="rubrique-apres" role="tabpanel" data-rubrique="apres" aria-labelledby="onglet-apres"
        hidden>
        <div class="groupe">
          <div class="ligne" data-reglage="copier" hidden>
            <div class="lb"><span class="libelle" id="l-copier">Copier automatiquement</span><p class="refus" data-refus role="status" hidden></p></div>
            <button role="switch" data-controle="copier" aria-labelledby="l-copier"
              aria-checked="false"><svg class="sw-picto sw-non" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg><svg class="sw-picto sw-oui" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.5 10.5 11.5 3.5"/></svg><span class="sw-bouton" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.2 6.4 4.8 9 9.8 3.2"/></svg></span></button>
          </div>
          <div class="ligne" data-reglage="enregistrer" hidden>
            <div class="lb"><span class="libelle" id="l-enregistrer">Enregistrer automatiquement</span><p class="refus" data-refus role="status" hidden></p></div>
            <button role="switch" data-controle="enregistrer" aria-labelledby="l-enregistrer"
              aria-checked="false"><svg class="sw-picto sw-non" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg><svg class="sw-picto sw-oui" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.5 10.5 11.5 3.5"/></svg><span class="sw-bouton" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.2 6.4 4.8 9 9.8 3.2"/></svg></span></button>
          </div>
          <div class="repli" data-repli="enregistrer"><div>
          <div class="ligne sous large" data-reglage="modele_nom" hidden>
            <div class="lb"><label class="libelle" id="l-nom" for="modele-nom">Nom des fichiers</label><p class="refus" data-refus role="status" hidden></p></div>
            <div class="ctl nom">
              <div class="champ">
                <input id="modele-nom" type="text" data-controle="modele_nom" spellcheck="false"
                  autocomplete="off" aria-describedby="apercu-nom">
                <button class="bouton-icone" data-controle="inserer" aria-label="Insérer" aria-haspopup="menu"
                  aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5v10M5 10h10"/></svg></button>
                <div class="menu" role="menu" data-menu="inserer" aria-label="Insérer" hidden>
                  <button role="menuitem" data-jeton="{date}">Date</button>
                  <button role="menuitem" data-jeton="{heure}">Heure</button>
                </div>
              </div>
              <span class="apercu" id="apercu-nom" data-valeur="apercu_nom"></span>
            </div>
          </div>
          </div></div>
          <div class="ligne" data-reglage="dossier" hidden>
            <div class="lb"><span class="libelle" id="l-dossier">Dossier</span><p class="refus" data-refus role="status" hidden></p></div>
            <div class="ctl">
              <span class="valeur" data-valeur="dossier"></span>
              <button class="bouton" data-controle="parcourir" aria-describedby="l-dossier">Parcourir…</button>
            </div>
          </div>
        </div>

        <div class="groupe">
          <div class="ligne" data-reglage="vignette" hidden>
            <div class="lb"><span class="libelle" id="l-vignette">Vignette</span><p class="refus" data-refus role="status" hidden></p></div>
            <button role="switch" data-controle="vignette" aria-labelledby="l-vignette"
              aria-checked="false"><svg class="sw-picto sw-non" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg><svg class="sw-picto sw-oui" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.5 10.5 11.5 3.5"/></svg><span class="sw-bouton" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.2 6.4 4.8 9 9.8 3.2"/></svg></span></button>
          </div>
          <div class="repli" data-repli="vignette"><div>
          <div class="ligne sous" data-reglage="vignette_duree" hidden>
            <div class="lb"><span class="libelle" id="l-duree">Durée</span><p class="refus" data-refus role="status" hidden></p></div>
            <div class="choix" role="radiogroup" data-controle="vignette_duree" aria-labelledby="l-duree"></div>
          </div>
          <div class="ligne sous" data-reglage="vignette_coin" hidden>
            <div class="lb"><span class="libelle" id="l-coin">Coin</span><p class="refus" data-refus role="status" hidden></p></div>
            <div class="coins" role="radiogroup" data-controle="vignette_coin" aria-labelledby="l-coin">
              <span class="pouce" aria-hidden="true"></span>
              <button role="radio" data-valeur="haut_gauche" aria-label="En haut à gauche"></button>
              <button role="radio" data-valeur="haut_droite" aria-label="En haut à droite"></button>
              <button role="radio" data-valeur="bas_gauche" aria-label="En bas à gauche"></button>
              <button role="radio" data-valeur="bas_droite" aria-label="En bas à droite"></button>
            </div>
          </div>
          </div></div>
        </div>
      </section>

      <section id="rubrique-raccourcis" role="tabpanel" data-rubrique="raccourcis"
        aria-labelledby="onglet-raccourcis" hidden>
        <div class="groupe" data-liste="raccourcis"></div>
        <template data-modele="raccourci">
          <div class="ligne" data-reglage="raccourci">
            <div class="lb"><span class="libelle" data-valeur="libelle"></span><p class="refus" data-refus role="status" hidden></p></div>
            <div class="ctl">
              <button class="bouton-icone retablir" data-controle="retablir" aria-label="Rétablir" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 9.5a5.5 5.5 0 1 0 1.7-4"/><path d="M5.5 2.8v3.4h3.4"/></svg></button>
              <button class="touches" data-controle="saisie" aria-pressed="false"></button>
            </div>
          </div>
        </template>
      </section>

      <section id="rubrique-general" role="tabpanel" data-rubrique="general" aria-labelledby="onglet-general"
        hidden>
        <div class="groupe">
          <div class="ligne large" data-reglage="licence" hidden>
            <div class="lb"><label class="libelle" id="l-licence" for="licence-texte">Licence</label><p class="refus" data-refus role="status" hidden></p></div>
            <div class="ctl" data-etat-licence="sans">
              <div class="champ licence">
                <input id="licence-texte" type="text" data-controle="licence_texte"
                  placeholder="Coller la licence" spellcheck="false" autocomplete="off">
              </div>
              <button class="bouton" data-controle="activer" disabled>Activer</button>
            </div>
            <div class="ctl" data-etat-licence="avec" hidden>
              <span class="valeur">Pro activé</span>
              <button class="bouton" data-controle="retirer">Retirer</button>
            </div>
          </div>
        </div>
        <div class="groupe apropos">
          <div class="ligne" data-reglage="version" hidden>
            <svg class="logo" viewBox="0 0 256 256" aria-hidden="true">
              <defs>
                <linearGradient id="logo-aurore" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="236" y2="246"><stop offset="0" class="logo-1"/><stop offset=".55" class="logo-2"/><stop offset="1" class="logo-3"/></linearGradient>
                <radialGradient id="logo-lumiere" cx=".25" cy=".12" r=".9"><stop offset="0" class="logo-l" stop-opacity=".38"/><stop offset=".6" class="logo-l" stop-opacity="0"/></radialGradient>
                <mask id="logo-masque" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><rect width="256" height="256" fill="#fff"/><g fill="none" stroke="#000" stroke-width="9" stroke-linejoin="round"><path d="M98 98Q100 64 80 40.3A100 100 0 0 1 215.7 80Q192 100 158 98Z" transform="rotate(0 128 128)"/><path d="M98 98Q100 64 80 40.3A100 100 0 0 1 215.7 80Q192 100 158 98Z" transform="rotate(90 128 128)"/><path d="M98 98Q100 64 80 40.3A100 100 0 0 1 215.7 80Q192 100 158 98Z" transform="rotate(180 128 128)"/><path d="M98 98Q100 64 80 40.3A100 100 0 0 1 215.7 80Q192 100 158 98Z" transform="rotate(270 128 128)"/></g></mask>
              </defs>
              <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#logo-aurore)"/><rect x="8" y="8" width="240" height="240" rx="58" fill="url(#logo-lumiere)"/>
              <g transform="translate(128 128) scale(.8) translate(-128 -128)"><g mask="url(#logo-masque)" class="logo-pales"><path d="M98 98Q100 64 80 40.3A100 100 0 0 1 215.7 80Q192 100 158 98Z" transform="rotate(0 128 128)" opacity="1"/><path d="M98 98Q100 64 80 40.3A100 100 0 0 1 215.7 80Q192 100 158 98Z" transform="rotate(90 128 128)" opacity="0.86"/><path d="M98 98Q100 64 80 40.3A100 100 0 0 1 215.7 80Q192 100 158 98Z" transform="rotate(180 128 128)" opacity="0.72"/><path d="M98 98Q100 64 80 40.3A100 100 0 0 1 215.7 80Q192 100 158 98Z" transform="rotate(270 128 128)" opacity="0.58"/></g></g>
            </svg>
            <span class="libelle" data-valeur="version"></span>
          </div>
        </div>
        <div class="groupe">
          <div class="ligne" data-reglage="theme" hidden>
            <div class="lb"><span class="libelle" id="l-theme">Thème</span><p class="refus" data-refus role="status" hidden></p></div>
            <div class="choix" role="radiogroup" data-controle="theme" aria-labelledby="l-theme">
              <button role="radio" data-valeur="systeme">Système</button>
              <button role="radio" data-valeur="clair">Clair</button>
              <button role="radio" data-valeur="sombre">Sombre</button>
            </div>
          </div>
          <div class="ligne" data-reglage="demarrage" hidden>
            <div class="lb"><span class="libelle" id="l-demarrage">Lancer au démarrage</span><p class="refus" data-refus role="status" hidden></p></div>
            <button role="switch" data-controle="demarrage" aria-labelledby="l-demarrage"
              aria-checked="false"><svg class="sw-picto sw-non" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg><svg class="sw-picto sw-oui" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.5 10.5 11.5 3.5"/></svg><span class="sw-bouton" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.2 6.4 4.8 9 9.8 3.2"/></svg></span></button>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
